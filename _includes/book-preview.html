{% assign thisBook = include.book %}
<a href="{{ thisBook.url | relative_url}}" class="bg-white shadow-lg rounded-lg overflow-hidden hover:shadow-2xl transition-shadow ">
  {% if thisBook.cover %}
    <img src="{{ site.baseurl }}/images/{{ thisBook.cover | relative_url}}" alt="{{ thisBook.title }}" class="w-full h-64 object-cover">
  {% endif %}
  <div class="p-4">
    <h2 class="text-xl font-gelica mb-2">{{ thisBook.title }}</h2>
    {% if thisBook.covernotes %}
      <p class="text-gray-700 text-sm">{{ thisBook.covernotes }}</p>
    {% endif %}
  </div>
</a>
